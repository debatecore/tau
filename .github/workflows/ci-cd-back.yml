name: CI/CD Backend

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

# L6: domyślnie GITHUB_TOKEN tylko do odczytu; joby dostają więcej tylko tam, gdzie muszą
permissions:
  contents: read

jobs:
  # L6: skan sekretów, SAST i skan zależności (plik security.yml)
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read

  test-and-build:
    name: Testy i budowanie obrazu Backendu
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # L6: lint Dockerfile (błędy blokują, ostrzeżenia tylko w logu)
      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold error - < Dockerfile

      - name: Logowanie do GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L6: najpierw tylko budujemy obraz lokalnie (bez push)...
      - name: Budowanie obrazu (test kompilacji)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: |
            ghcr.io/oliviam555/tau:latest
            ghcr.io/oliviam555/tau:${{ github.sha }}

      # L6: ...skanujemy DOKŁADNIE ten obraz, który zaraz trafi do rejestru...
      - name: Skan obrazu (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            ghcr.io/oliviam555/tau:${{ github.sha }}

      # L6: ...i wypychamy go dopiero, gdy skan przeszedł (tylko po merge do master).
      # Tag z SHA commita = wiadomo, która wersja jest wdrożona, łatwy rollback.
      - name: Wypchnięcie obrazu do GHCR
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          docker push ghcr.io/oliviam555/tau:${{ github.sha }}
          docker push ghcr.io/oliviam555/tau:latest

  deploy:
    name: Wdrożenie Backendu na AWS
    needs: [security, test-and-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # L6: pozwala jobowi pobrać token OIDC od GitHuba
    steps:
      # L6: logowanie do AWS przez OIDC – bez stałych kluczy w GitHub Secrets.
      # GitHub wystawia token dla tego joba, AWS wymienia go na tymczasowe poświadczenia
      # roli github-granda-deploy (zaufanie tylko dla tego repo w environmencie production).
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Aktualizacja kontenera backend przez SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=granda-app" \
            --parameters 'commands=[
              "sed -i \"s|image: ghcr.io/.*/tau:latest|image: ghcr.io/oliviam555/tau:latest|g\" /opt/granda/compose.yaml",
              "cd /opt/granda && docker compose pull backend && docker compose up -d backend"
            ]'
